<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preprint | TrueLocus</title>
  <meta name="description" content="Preprint draft in progress.">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3">
  <script>
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      location.replace('https:' + window.location.href.substring(window.location.protocol.length));
    }
  </script>
  <style>
    :root {
      --bg: #faf9f6;
      --surface: #ffffff;
      --border: #18181b;
      --border-light: #e4e4e7;
      --text: #09090b;
      --text-muted: #52525b;
      --accent-lavender: #ede9fe;
      --accent-coral: #ffe4e6;
      --accent-sky: #e0f2fe;
      --accent-blue: #0284c7;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.55;
      padding: 0;
      margin: 0;
      width: 100%;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 40px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .nav-link {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s ease;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--text);
    }
    .btn-header {
      font-size: 0.85rem;
      font-family: var(--mono);
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      padding: 7px 18px;
      border: 1px solid var(--border);
      border-radius: 9999px;
      background: var(--accent-lavender);
    }
    .content-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 50px 24px 80px 24px;
      flex: 1;
      width: 100%;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
      line-height: 1.2;
    }
    .lead {
      color: var(--text-muted);
      font-size: 1.02rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-family: var(--mono);
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    input[type="text"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 10px 14px;
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: background 0.15s ease;
    }
    input:focus,
    select:focus,
    textarea:focus {
      background: #ffffff;
    }
    textarea {
      resize: vertical;
      min-height: 110px;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--text);
      color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-top: 8px;
    }
    .btn-submit:hover {
      background: #27272a;
    }
    .direct-contact {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--border-light);
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .direct-contact a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 600;
    }
    footer {
      width: 100%;
      padding: 24px 40px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.82rem;
      background: #fafafa;
    }
    footer a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
    }
    footer a:hover {
      text-decoration: underline;
    }
    @media (max-width: 900px) {
      header {
        padding: 16px 20px;
      }
      .content-container {
        padding: 40px 20px 60px 20px;
      }
      footer {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand">
      <span style="background: var(--text); color: var(--bg); padding: 2px 8px; display: inline-block;">TrueLocus</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link">Overview</a>
      <a href="./preprint.html" class="nav-link active" style="color: var(--text); font-weight: 600;">Preprint</a>
      <a href="./contact.html" class="btn-header">Contact</a>
    </div>
  </header>

  <div class="content-container">
    <h1>Preprint</h1>
    <p class="lead" style="font-size: 1.1rem; color: var(--text-muted);">
      Draft in progress
    </p>
  </div>

  <footer>
    <div>&copy; 2026 TrueLocus. All rights reserved.</div>
    <div>
      <a href="/">Home</a> &bull;
      <a href="./preprint.html">Preprint</a> &bull;
      <a href="./contact.html">Contact</a> &bull;
      <a href="mailto:contact@truelocus.bio">Email</a>
    </div>
  </footer>
</body>
</html>
